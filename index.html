<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101529">
  <meta name="description" content="一次、二次、三次多項式函數圖形，三人獨立觸控闖關。">
  <title>函數圖形試煉塔</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=1.0.1">
  <script defer src="core.js?v=1.0.1"></script>
  <script defer src="app.js?v=1.0.1"></script>
</head>
<body data-theme="dark">
  <div class="ambient" aria-hidden="true"></div>
  <div id="app">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true">✧</div>
      <div class="brand"><div class="eyebrow">THE POLYNOMIAL ATELIER</div><h1>函數圖形<span>試煉塔</span></h1></div>
      <div class="header-note"><span class="status-dot"></span>三區獨立闖關<span class="note-divider">/</span>觀察係數，解鎖曲線</div>
      <div class="header-tools">
        <button id="teacher-trigger" class="teacher-trigger" aria-label="教師設定，請長按一點五秒" title="長按 1.5 秒開啟教師工具"><span class="hold-fill"></span><span class="teacher-icon">⚙</span><span class="teacher-copy">教師工具<small>長按 1.5 秒</small></span></button>
        <button id="fullscreen-trigger" class="fullscreen-button" data-action="fullscreen" aria-label="進入全螢幕" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全螢幕</span></button>
      </div>
    </header>
    <main id="arena" class="arena" aria-label="三位玩家各自獨立的闖關區"></main>
    <footer class="page-footer"><span>點選圖形或配對，再按「確認答案」</span><span>答錯 −10 秒 · 鎖定送出 3 秒<span class="version">v1.0.1</span></span></footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <noscript>請啟用瀏覽器的 JavaScript 才能遊玩。</noscript>
</body>
</html>
